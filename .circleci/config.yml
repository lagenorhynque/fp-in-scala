version: 2.1

jobs:
  build-clj:
    docker:
      - image: cimg/clojure:1.12.0-openjdk-21.0
    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "deps.edn" }}
            - v1-dependencies-
      - run: make prepare-clj
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies--{{ checksum "deps.edn" }}
      - run: make test-and-build-clj

  build-scala:
    docker:
      - image: cimg/openjdk:25.0.1
    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "build.sbt" }}
            - v1-dependencies-
      - run: make compile-scala
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies--{{ checksum "build.sbt" }}
      - run: make test-scala

  build-flix:
    docker:
      - image: cimg/openjdk:25.0.1
    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "flix.toml" }}
            - v1-dependencies-
      - run:
          name: Install Flix
          environment:
            FLIX_VERSION: 0.70.0
          command: |
            wget https://github.com/flix/flix/releases/download/v${FLIX_VERSION}/flix.jar
            echo 'exec java -jar ${CIRCLE_WORKING_DIRECTORY}/flix.jar' > flix
            chmod +x flix
            sudo mv -f flix /usr/local/bin/
      - run: make compile-flix
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies--{{ checksum "flix.toml" }}
      - run: make test-flix

workflows:
  builds:
    jobs:
      - build-clj
      - build-scala
      - build-flix
